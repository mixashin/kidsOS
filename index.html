<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KidsOS</title>
  <meta name="description" content="A fun educational OS simulator for kids to learn computing">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KidsOS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop -->
  <div id="desktop">
    <!-- Desktop Icons -->
    <div id="desktop-icons">
    </div>

    <!-- Windows container -->
    <div id="windows-container"></div>

    <!-- Taskbar -->
    <div id="taskbar">
      <div id="taskbar-left">
        <button id="app-menu-btn" onclick="OS.toggleAppMenu()">
          <span>🐧</span> Apps
        </button>
      </div>
      <div id="taskbar-center"></div>
      <div id="taskbar-right">
        <div id="taskbar-clock">
          <span id="clock-time">00:00</span>
          <span id="clock-date">Mon 01 Jan</span>
        </div>
      </div>
    </div>

    <!-- App Menu (Start Menu) -->
    <div id="app-menu" class="hidden">
      <div class="app-menu-header">
        <span id="menu-username">👤 User</span>
      </div>
      <div class="app-menu-grid" id="app-menu-grid">
      </div>
      <div class="app-menu-footer">
        <button onclick="OS.shutdown()">⏻ Shutdown</button>
      </div>
    </div>
  </div>

  <!-- Boot Screen -->
  <div id="boot-screen">
    <div id="boot-content">
      <div id="boot-logo">🐧</div>
      <div id="boot-title">KidsOS</div>
      <div id="boot-subtitle">Learning Computing the Fun Way!</div>
      <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
    </div>
  </div>

  <!-- Three.js import map (used by Pocket Pal 3D) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three-0.149.0/build/three.module.js",
      "three/addons/": "./vendor/three-0.149.0/examples/jsm/"
    }
  }
  </script>

  <!-- Scripts -->
  <script src="js/os.js"></script>
  <script>
    window.addEventListener('load', () => OS.boot());
    // After update: clean URL param once SW is ready
    if (location.search.includes('_update')) {
      var _cleaned = false;
      var _doClean = function() {
        if (_cleaned) return;
        _cleaned = true;
        history.replaceState(null, '', location.pathname);
      };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(_doClean);
        setTimeout(_doClean, 8000);
      } else { _doClean(); }
    }
  </script>
</body>
</html>
