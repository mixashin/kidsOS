<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KidsOS</title>
  <meta name="description" content="A fun educational OS simulator for kids to learn computing">
  <meta name="theme-color" content="#FFF6E3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KidsOS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shell. Touch mode: top bar, home, dock. Mouse mode: desktop and taskbar. The look is in shell.css. -->
  <div id="desktop">
    <header id="top-bar">
      <div class="k-pill" id="hello"><img src="art/mascot/hello.webp" alt="" draggable="false"><span id="hello-text">Hello!</span></div>
      <span class="k-grow"></span>
      <button class="k-pill k-coins" data-coins aria-label="Giggle Coins"><img class="k-coin" src="art/objects/coin.webp" alt="" draggable="false"><span class="k-coin-count">50</span></button>
      <div class="k-pill k-clock"><span class="clock-time">00:00</span><small class="clock-date">Mon 01 Jan</small></div>
    </header>

    <!-- App tiles -->
    <div id="desktop-icons">
    </div>

    <!-- Windows container -->
    <div id="windows-container"></div>

    <!-- Taskbar -->
    <div id="taskbar">
      <div id="taskbar-left">
        <button id="home-btn" aria-label="Home" onclick="OS.goHome()"></button>
        <button id="app-menu-btn" onclick="OS.toggleAppMenu()">
          <img src="art/mascot/head.webp" alt="" draggable="false"> Apps
        </button>
      </div>
      <div id="taskbar-center"></div>
      <div id="taskbar-right">
        <button class="k-pill k-coins" data-coins aria-label="Giggle Coins"><img class="k-coin" src="art/objects/coin.webp" alt="" draggable="false"><span class="k-coin-count">50</span></button>
        <div id="taskbar-clock">
          <span id="clock-time" class="clock-time">00:00</span>
          <span id="clock-date" class="clock-date">Mon 01 Jan</span>
        </div>
      </div>
    </div>

    <!-- App Menu (Start Menu) -->
    <div id="app-menu" class="hidden">
      <div class="app-menu-header">
        <span id="menu-username">👤 User</span>
      </div>
      <div class="app-menu-grid" id="app-menu-grid">
      </div>
      <div class="app-menu-footer">
        <button onclick="OS.shutdown()">⏻ Shutdown</button>
      </div>
    </div>
  </div>

  <!-- Boot Screen -->
  <div id="boot-screen">
    <div id="boot-content">
      <div id="boot-logo"><img src="art/mascot/hello.webp" alt="" draggable="false"></div>
      <div id="boot-title">KidsOS</div>
      <div id="boot-subtitle">Learning Computing the Fun Way!</div>
      <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
    </div>
  </div>

  <!-- Three.js import map (used by Pocket Pal 3D) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three-0.149.0/build/three.module.js",
      "three/addons/": "./vendor/three-0.149.0/examples/jsm/"
    }
  }
  </script>

  <!-- Scripts -->
  <script src="js/lang.js"></script>
  <script src="js/os.js"></script>
  <script>
    window.addEventListener('load', () => OS.boot());
    // After update: clean URL param once SW is ready
    if (location.search.includes('_update')) {
      var _cleaned = false;
      var _doClean = function() {
        if (_cleaned) return;
        _cleaned = true;
        history.replaceState(null, '', location.pathname);
      };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(_doClean);
        setTimeout(_doClean, 8000);
      } else { _doClean(); }
    }
  </script>
</body>
</html>
